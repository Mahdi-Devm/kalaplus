name: Shared CI setup

description: >-
  Composite action shared by all KalaPlus CI workflows.

inputs:
  node-version:
    description: Node.js version to use
    required: false
    default: "22"

runs:
  using: composite

  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11.25.0
        run_install: false

    - name: Verify toolchain
      shell: bash
      run: |
        echo "===== TOOLCHAIN ====="
        echo "Node:"
        node -v
        echo "pnpm:"
        pnpm -v
        echo "Corepack:"
        corepack --version
        echo "===================="

    - name: Install dependencies
      shell: bash
      run: |
        echo "===== INSTALL DEPENDENCIES ====="
        pnpm install --frozen-lockfile
        echo "===== INSTALL PASSED ====="

    - name: Show turbo version
      shell: bash
      run: |
        echo "===== TURBO ====="
        pnpm exec turbo --version
