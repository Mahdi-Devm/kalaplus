name: Shared CI setup

description: >-
  Composite action shared by all KalaPlus CI workflows: checkout, pnpm setup
  with dependency caching, and a frozen-lockfile install.

inputs:
  node-version:
    description: Node.js version to use
    required: false
    default: "22"

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        # Matches package.json "devEngines.packageManager" (11.25.0).
        # pnpm/action-setup does not parse "devEngines" (only "packageManager"),
        # so the version is pinned here on purpose.
        version: 11.25.0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install

    - name: Show turbo version
      shell: bash
      run: pnpm exec turbo --version
