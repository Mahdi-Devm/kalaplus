version: 2

updates:
  # Root workspace (turbo, prettier, typescript)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      root-dev-deps:
        dependency-type: development

  # Backend (NestJS)
  - package-ecosystem: npm
    directory: /apps/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      api-deps:
        dependency-type: production
      api-dev-deps:
        dependency-type: development

  # Frontend (Next.js)
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web-deps:
        dependency-type: production
      web-dev-deps:
        dependency-type: development

  # Shared ESLint config package
  - package-ecosystem: npm
    directory: /packages/eslint-config
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # GitHub Actions used in workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
