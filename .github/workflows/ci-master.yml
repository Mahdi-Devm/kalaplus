name: CI (Pull Request)

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ci-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (web + api)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Environment info
        run: |
          echo "===== LINT ENVIRONMENT ====="
          echo "Node:"
          node -v
          echo "pnpm:"
          pnpm -v
          echo "Working directory:"
          pwd
          echo "Git commit:"
          git rev-parse --short HEAD
          echo "============================"

      - name: Lint
        run: |
          echo "===== START LINT ====="
          pnpm lint
          echo "===== LINT PASSED ====="

  typecheck:
    name: Typecheck (web + api)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Environment info
        run: |
          echo "===== TYPECHECK ENVIRONMENT ====="
          echo "Node:"
          node -v
          echo "pnpm:"
          pnpm -v
          echo "TypeScript API:"
          pnpm --filter api exec tsc --version
          echo "TypeScript Web:"
          pnpm --filter web exec tsc --version
          echo "Working directory:"
          pwd
          echo "Git commit:"
          git rev-parse --short HEAD
          echo "================================="

      - name: Typecheck API
        run: |
          echo "===== START API TYPECHECK ====="
          pnpm --filter api exec tsc --noEmit
          echo "===== API TYPECHECK PASSED ====="

      - name: Typecheck Web
        run: |
          echo "===== START WEB TYPECHECK ====="
          pnpm --filter web exec tsc --noEmit
          echo "===== WEB TYPECHECK PASSED ====="

  test:
    name: Tests (web)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Environment info
        run: |
          echo "===== TEST ENVIRONMENT ====="
          echo "Node:"
          node -v
          echo "pnpm:"
          pnpm -v
          echo "Working directory:"
          pwd
          echo "Git commit:"
          git rev-parse --short HEAD
          echo "============================"

      - name: Test Web
        run: |
          echo "===== START WEB TESTS ====="
          pnpm --filter web test -- --run
          echo "===== WEB TESTS PASSED ====="

  build-web:
    name: Build Web (Next.js)
    runs-on: ubuntu-latest

    needs:
      - lint
      - typecheck
      - test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Environment info
        run: |
          echo "===== WEB BUILD ENVIRONMENT ====="
          echo "Node:"
          node -v
          echo "pnpm:"
          pnpm -v
          echo "Next.js:"
          pnpm --filter web exec next --version
          echo "Working directory:"
          pwd
          echo "Git commit:"
          git rev-parse --short HEAD
          echo "================================="

      - name: Build Web
        run: |
          echo "===== START NEXT.JS BUILD ====="
          pnpm --filter web build
          echo "===== NEXT.JS BUILD PASSED ====="

  build-api:
  name: Build API (NestJS)
  runs-on: ubuntu-latest

  needs:
    - lint
    - typecheck
    - test

  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup monorepo
      uses: ./.github/actions/setup-monorepo

    - name: Environment info
      run: |
        echo "===== API BUILD ENVIRONMENT ====="
        echo "Node:"
        node -v
        echo "pnpm:"
        pnpm -v
        echo "Working directory:"
        pwd
        echo "Git commit:"
        git rev-parse --short HEAD
        echo "================================="

    - name: Build API
      run: |
        echo "===== START NESTJS BUILD ====="
        pnpm --filter api build
        echo "===== NESTJS BUILD PASSED ====="
