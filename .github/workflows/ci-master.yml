name: Master Production Validation

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ci-master-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lint:
    name: Lint (web + api)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Lint
        run: pnpm lint

  typecheck:
    name: Typecheck (web + api)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Typecheck API
        run: pnpm --filter api exec tsc --noEmit

      - name: Typecheck Web
        run: pnpm --filter web exec tsc --noEmit

  test:
    name: Tests (web)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Test Web
        run: pnpm --filter web test -- --run

  build-web:
    name: Build Web (Next.js)
    runs-on: ubuntu-latest
    needs:
      - lint
      - typecheck
      - test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Build Web
        run: pnpm --filter web build

  build-api:
    name: Build API (NestJS)
    runs-on: ubuntu-latest
    needs:
      - lint
      - typecheck
      - test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Build API
        run: pnpm --filter api build

  docker:
    name: Production Docker Images
    runs-on: ubuntu-latest
    needs:
      - build-web
      - build-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: false
          tags: kalaplus/api:${{ github.sha }}
          cache-from: type=gha,scope=api-production
          cache-to: type=gha,mode=max,scope=api-production

      - name: Build Web production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          push: false
          tags: kalaplus/web:${{ github.sha }}
          cache-from: type=gha,scope=web-production
          cache-to: type=gha,mode=max,scope=web-production

  deploy-placeholder:
    name: Deployment (not configured)
    runs-on: ubuntu-latest
    needs:
      - docker
      - security

    steps:
      - name: Deployment status
        run: |
          echo "Production validation completed successfully."
          echo "Deployment is not configured yet."
          echo "No deployment provider or registry is configured."
