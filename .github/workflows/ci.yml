name: CI (Pull Request)

on:
  pull_request:
    branches:
      - master

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (web + api)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Lint
        run: pnpm lint

  typecheck:
    name: Typecheck (web + api)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Typecheck API
        run: pnpm --filter api exec tsc --noEmit

      - name: Typecheck Web
        run: pnpm --filter web exec tsc --noEmit

  test:
    name: Tests (web + api)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Test Web
        run: pnpm --filter web test -- --run

      - name: Test API
        run: pnpm --filter api test

  build-web:
    name: Build Web (Next.js)
    runs-on: ubuntu-latest
    needs:
      - lint
      - typecheck
      - test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Build Web
        run: pnpm --filter web build

  build-api:
    name: Build API (NestJS)
    runs-on: ubuntu-latest
    needs:
      - lint
      - typecheck
      - test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Build API
        run: pnpm --filter api build

  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit
        run: pnpm audit --audit-level=high

  docker:
    name: Docker Build (web + api)
    runs-on: ubuntu-latest
    needs:
      - build-web
      - build-api

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: false
          tags: kalaplus/api:ci-${{ github.event.pull_request.number }}
          cache-from: type=gha,scope=api-ci
          cache-to: type=gha,mode=max,scope=api-ci

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          push: false
          tags: kalaplus/web:ci-${{ github.event.pull_request.number }}
          cache-from: type=gha,scope=web-ci
          cache-to: type=gha,mode=max,scope=web-ci
