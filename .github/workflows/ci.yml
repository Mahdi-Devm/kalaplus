name: CI (Pull Request)

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ci-master-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lint:
    name: Lint (web + api)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Environment info
        run: |
          echo "===== LINT ENVIRONMENT ====="
          echo "Node:"
          node -v
          echo "pnpm:"
          pnpm -v
          echo "Working directory:"
          pwd
          echo "Git commit:"
          git rev-parse --short HEAD
          echo "============================"

      - name: Lint
        run: |
          echo "===== START LINT ====="
          pnpm lint
          echo "===== LINT PASSED ====="

  typecheck:
    name: Typecheck (web + api)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Environment info
        run: |
          echo "===== TYPECHECK ENVIRONMENT ====="
          echo "Node:"
          node -v
          echo "pnpm:"
          pnpm -v
          echo "TypeScript API:"
          pnpm --filter api exec tsc --version
          echo "TypeScript Web:"
          pnpm --filter web exec tsc --version
          echo "Working directory:"
          pwd
          echo "Git commit:"
          git rev-parse --short HEAD
          echo "================================="

      - name: Typecheck API
        run: |
          echo "===== START API TYPECHECK ====="
          pnpm --filter api exec tsc --noEmit
          echo "===== API TYPECHECK PASSED ====="

      - name: Typecheck Web
        run: |
          echo "===== START WEB TYPECHECK ====="
          pnpm --filter web exec tsc --noEmit
          echo "===== WEB TYPECHECK PASSED ====="

  test:
    name: Tests (web)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Environment info
        run: |
          echo "===== TEST ENVIRONMENT ====="
          echo "Node:"
          node -v
          echo "pnpm:"
          pnpm -v
          echo "Working directory:"
          pwd
          echo "Git commit:"
          git rev-parse --short HEAD
          echo "============================"

      - name: Test Web
        run: |
          echo "===== START WEB TESTS ====="
          pnpm --filter web test -- --run
          echo "===== WEB TESTS PASSED ====="

  build-web:
    name: Build Web (Next.js)
    runs-on: ubuntu-latest

    needs:
      - lint
      - typecheck
      - test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Environment info
        run: |
          echo "===== WEB BUILD ENVIRONMENT ====="
          echo "Node:"
          node -v
          echo "pnpm:"
          pnpm -v
          echo "Next.js:"
          pnpm --filter web exec next --version
          echo "Working directory:"
          pwd
          echo "Git commit:"
          git rev-parse --short HEAD
          echo "================================="

      - name: Build Web
        run: |
          echo "===== START NEXT.JS BUILD ====="
          pnpm --filter web build
          echo "===== NEXT.JS BUILD PASSED ====="

  build-api:
    name: Build API (NestJS)
    runs-on: ubuntu-latest

    needs:
      - lint
      - typecheck
      - test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Environment info
        run: |
          echo "===== API BUILD ENVIRONMENT ====="
          echo "Node:"
          node -v
          echo "pnpm:"
          pnpm -v
          echo "Working directory:"
          pwd
          echo "Git commit:"
          git rev-parse --short HEAD
          echo "================================="

      - name: Build API
        run: |
          echo "===== START NESTJS BUILD ====="
          pnpm --filter api build
          echo "===== NESTJS BUILD PASSED ====="

  docker:
    name: Production Docker Images
    runs-on: ubuntu-latest

    needs:
      - build-web
      - build-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker environment info
        run: |
          echo "===== DOCKER ENVIRONMENT ====="
          docker --version
          docker buildx version
          echo "Working directory:"
          pwd
          echo "Git commit:"
          git rev-parse --short HEAD
          echo "=============================="

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API production image
        run: |
          echo "===== START API DOCKER BUILD ====="
          docker build \
            --file docker/Dockerfile.api \
            --tag kalaplus/api:${{ github.sha }} \
            .
          echo "===== API DOCKER BUILD PASSED ====="

      - name: Build Web production image
        run: |
          echo "===== START WEB DOCKER BUILD ====="
          docker build \
            --file docker/Dockerfile.web \
            --tag kalaplus/web:${{ github.sha }} \
            .
          echo "===== WEB DOCKER BUILD PASSED ====="

      - name: Docker images summary
        run: |
          echo "===== DOCKER IMAGES ====="
          docker images | grep kalaplus || true
          echo "========================"

  deploy-placeholder:
    name: Deployment (not configured)
    runs-on: ubuntu-latest

    needs:
      - docker

    steps:
      - name: Deployment status
        run: |
          echo "======================================"
          echo "   KALAPLUS PRODUCTION VALIDATION"
          echo "======================================"
          echo ""
          echo "Docker validation completed successfully."
          echo ""
          echo "Deployment is not configured yet."
          echo "No deployment provider or registry is configured."
          echo ""
          echo "Commit:"
          echo "${{ github.sha }}"
          echo ""
          echo "Branch:"
          echo "${{ github.ref_name }}"
          echo ""
          echo "======================================"
